name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ci:
    uses: IntegralMotions/CppTooling/.github/workflows/cpp-ci.yml@v0.1.2
    with:
      ignore_tidy: 'tests/**|build/**|mpack/**'
      ignore_format: 'tests/**|build/**|mpack/**'
    secrets: inherit
