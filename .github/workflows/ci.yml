name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ci:
    uses: IntegralMotions/CppTooling/.github/workflows/cpp-ci.yml@fix/header-aware-tidy
    with:
      ignore_tidy: 'build/**|mpack/**'
      ignore_format: 'tests/**|build/**|mpack/**'
      tidy_extensions: 'c,cc,cpp,cxx'
    secrets: inherit
